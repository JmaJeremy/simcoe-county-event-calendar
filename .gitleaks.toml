# gitleaks configuration: the default rules, minus identifiers that look like keys but are
# public by design. Keep this list short and specific — every entry is a blind spot.
[extend]
useDefault = true

[[allowlists]]
description = "Public identifiers that match the generic-api-key rule"
regexTarget = "line"
regexes = [
  # reCAPTCHA site keys inside event pages captured as adapter fixtures. Site keys are
  # served to every visitor of those sites.
  '''data-sitekey=''',
  '''"sitekey":''',
]
